name: Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          for file in index.html styles.css README.md SECURITY.md LICENSE 404.html robots.txt sitemap.xml .gitignore .well-known/security.txt; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Scan for public attribution leakage
        run: |
          if grep -RniE 'co-authored-by:|generated (by|with)|ai-generated|assistant attribution|tool attribution|master prompt|prompt artifact|private build workflow' \
            --include='*.html' --include='*.md' --include='*.css' --exclude='styles.css' .; then
            echo "Public attribution or private-build marker found"
            exit 1
          fi

      - name: Serve site and verify responses
        run: |
          python3 -m http.server 8080 &
          sleep 2
          for path in / /robots.txt /sitemap.xml /404.html /LICENSE /SECURITY.md /README.md /.well-known/security.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080${path}")
            if [ "$code" != "200" ]; then
              echo "Unexpected HTTP $code for $path"
              exit 1
            fi
          done
