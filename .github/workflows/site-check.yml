name: Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run static security audit
        run: |
          set -euo pipefail
          python3 scripts/site_audit.py

      - name: Run intake Worker unit tests
        run: |
          set -euo pipefail
          node --test worker/intake.test.mjs

      - name: Serve site and verify responses
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/thor-sec-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2

          for path in \
            / \
            /research.html \
            /work.html \
            /about.html \
            /inventions.html \
            /security.html \
            /now.html \
            /robots.txt \
            /sitemap.xml \
            /feed.xml \
            /404.html \
            /LICENSE \
            /SECURITY.md \
            /README.md \
            /.well-known/security.txt; do
            code=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:8080${path}")
            if [ "$code" != "200" ]; then
              echo "Unexpected HTTP $code for $path"
              exit 1
            fi
          done
