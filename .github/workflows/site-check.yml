name: Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run static security audit
        run: |
          set -euo pipefail
          python3 scripts/site_audit.py

      - name: Check research pages match scripts/research.json
        run: |
          set -euo pipefail
          python3 scripts/build_research.py --check

      - name: Check case-study pages match scripts/case_studies.json
        run: |
          set -euo pipefail
          python3 scripts/build_case_studies.py --check

      - name: Check invention page matches intentional public disclosures
        run: |
          set -euo pipefail
          python3 scripts/build_inventions.py --check

      - name: Run intake Worker unit tests
        run: |
          set -euo pipefail
          node --test worker/intake.test.mjs

      - name: Serve site and verify responses
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/thor-sec-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2

          check_path() {
            local path="$1"
            local code
            code=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:8080${path}")
            if [ "$code" != "200" ]; then
              echo "Unexpected HTTP $code for $path"
              exit 1
            fi
          }

          static_paths=(
            /
            /research.html
            /case-studies.html
            /work.html
            /about.html
            /inventions.html
            /security.html
            /now.html
            /robots.txt
            /sitemap.xml
            /feed.xml
            /404.html
            /request-received.html
            /LICENSE
            /SECURITY.md
            /README.md
            /.well-known/security.txt
          )

          for path in "${static_paths[@]}"; do
            check_path "$path"
          done

          python3 - <<'PY' >/tmp/thor-sec-generated-paths
          import json

          research = json.load(open("scripts/research.json"))
          for entry in research["entries"]:
              if entry.get("kind") == "paper":
                  print(f"/research/{entry['id']}.html")

          cases = json.load(open("scripts/case_studies.json"))
          for entry in cases["entries"]:
              print(f"/case-studies/{entry['id']}.html")
          PY

          while IFS= read -r path; do
            check_path "$path"
          done </tmp/thor-sec-generated-paths
